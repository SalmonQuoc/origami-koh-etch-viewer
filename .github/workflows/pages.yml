name: Publish to GitHub Pages

# Publishes index.html by hand (Actions -> Publish to GitHub Pages -> Run workflow).
# The automatic publish after each push is the "pages" job in ci.yml.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no job pushes; keep the token out of .git/config
      - name: Collect the site
        run: mkdir _site && cp index.html .nojekyll _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages lists the run's artifacts at once; right after the upload the list can still be empty
      # ("No artifacts named github-pages", 2026-11-25), so give it a few seconds
      - name: Let the uploaded artifact register
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
