name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04   # Playwright 1.56 has no Chromium build for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no job pushes; keep the token out of .git/config
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Rust toolchain with the WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - name: Data files
        run: npm run validate
      - name: Type check
        run: npm run typecheck
      - name: Rust unit tests
        run: cargo test --manifest-path engine/Cargo.toml --release
      - name: index.html is up to date with src/, data/ and engine/etch_core.wasm
        run: |
          node build.mjs
          git diff --exit-code -- index.html || (echo "::error::index.html differs from a fresh build. Run npm run build and commit index.html." && exit 1)
      - name: Engine and data tests (committed kernel)
        run: npm test
      - name: Engine tests with a freshly compiled kernel
        run: npm run build:wasm && node --test tests/engine-parity.test.mjs tests/engine-physics.test.mjs
      - name: Browser test
        run: |
          npx playwright install --with-deps chromium
          npm run test:browser

  # Publish index.html to GitHub Pages after the checks pass on main (same run, so the
  # deploy step finds the uploaded artifact; a separate workflow_run workflow did not).
  pages:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false   # no job pushes; keep the token out of .git/config
      - name: Collect the site
        run: mkdir _site && cp index.html .nojekyll _site/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      # deploy-pages lists the run's artifacts at once; right after the upload the list can still be empty
      # ("No artifacts named github-pages", 2026-11-25), so give it a few seconds
      - name: Let the uploaded artifact register
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v5
